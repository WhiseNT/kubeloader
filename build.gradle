plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'net.neoforged.moddev' version '2.0.137'
    // 注意版本：1.2.30 起要求 Gradle 运行在 JVM 25+，本工程用 JDK 21，故停在 1.1.28
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    enable {
        version = project.neoforge_version

        runs {
            configureEach {
                logLevel = org.slf4j.event.Level.DEBUG
            }

            client {
                client()
                gameDirectory = file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
                systemProperty 'mixin.env.remapRefMap', 'true'
            }

            server {
                server()
                gameDirectory = file('run')
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
            }

            data {
                data()
                gameDirectory = file('run-data')
                programArguments.addAll(
                        '--mod', project.mod_id,
                        '--all',
                        '--output', file('src/generated/resources').getAbsolutePath(),
                        '--existing', file('src/main/resources').getAbsolutePath(),
                        '--existing-mod', 'kubejs'
                )
            }
        }

        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        // KubeJS 官方 maven（2101.7.2-build.374，含 ItemBehavior 重构）
        url = 'https://maven.latvian.dev/releases'
    }

    maven {
        // KubeJS 374 传递依赖 animated-gif-lib-for-java 发布于此
        url = 'https://jitpack.io'
    }

    maven {
        url = 'https://cursemaven.com/'
    }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // KubeJS 2101.7.2-build.374+（#17 修复：ItemBuilder.ReleaseUsingCallback 已重构进 ItemBehavior）
    implementation "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.374"
    implementation "curse.maven:rhino-416294:${project.rhino_curse_file}"
    // implementation "curse.maven:probejs-585406:7105159"
    implementation "curse.maven:graal-1504336:${project.graal_curse_file}"
}

// 回归检查：ModernJS 转换（issue #22 等）。纯字符串逻辑 + 项目自带 Rhino，
// 不引入测试框架依赖、不启动游戏，因此本机与 CI 都能直接跑。
tasks.register('parserRegressionCheck', JavaExec) {
    group = 'verification'
    description = '运行 ModernJSParser 回归检查（用例在 src/test/java 下）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whisent.kubeloader.scripts.ModernJSParserRegressionCheck'
    // 用例失败会抛 AssertionError → 任务失败，可用于 CI（见下方 check 依赖）
}

// 回归检查：Rhino 内建补丁（globalThis / at / hasOwn / fromEntries / replaceAll /
// flat / flatMap / matchAll）。同样只依赖项目自带的 Rhino，不启动游戏。
tasks.register('polyfillRegressionCheck', JavaExec) {
    group = 'verification'
    description = '运行 Rhino 内建补丁的回归检查（用例在 src/test/java 下）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whisent.kubeloader.compat.RhinoPolyfillRegressionCheck'
}

// 示例语料库检查：examples/modernjs 下的每个 .js 都按线上链路（转换 → Rhino 校验 →
// 执行，并装好内建补丁）真跑一遍，断言脚本里写下的期望值。
// 加 -PmodernjsVerbose 可打印脚本里的 console 输出。
tasks.register('modernJSCorpusCheck', JavaExec) {
    group = 'verification'
    description = '运行 ModernJS 示例语料库检查（脚本在 examples/modernjs 下）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.whisent.kubeloader.scripts.ModernJSScriptCorpusCheck'
    systemProperty 'modernjs.corpus', file('examples/modernjs').absolutePath
    if (project.hasProperty('modernjsVerbose')) {
        systemProperty 'modernjs.verbose', 'true'
    }
}

tasks.named('check') {
    dependsOn tasks.named('parserRegressionCheck')
    dependsOn tasks.named('polyfillRegressionCheck')
    dependsOn tasks.named('modernJSCorpusCheck')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neoforge_version       : neoforge_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : '1',
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    options.compilerArgs << '-parameters'
}

// ── CurseForge 发布 ──────────────────────────────────────────────────
// 用法： CURSEFORGE_TOKEN=xxx ./gradlew publishCurseForge
// 可选： -PcfReleaseType=alpha|beta|release   -PcfDisplayName="..."   -PcfChangelog="..."
// 凭证只从环境变量读取，不写入任何版本库文件。
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = '构建并把产物上传到 CurseForge（需要环境变量 CURSEFORGE_TOKEN）'

    dependsOn tasks.named('build')
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: ''
    // 端点必须是 minecraft.curseforge.com（1.1.28 的默认值）：实测只有它同时满足
    //   · 读取 /api/game/versions 与 /api/game/version-types（legacy 返回空数组，www 返回另一套数据）
    //   · 上传 /api/projects/<id>/upload-file（需真实 multipart 体，无 body 的请求会得到 411）
    apiEndpoint = project.findProperty('cfApiEndpoint') ?: 'https://minecraft.curseforge.com'

    // 签名是 upload(projectId, artifact) —— 项目 ID 在前
    upload('1205072', tasks.named('jar').flatMap { it.archiveFile }) {
        // CF 上的显示名统一成 kubeloader-<mod_version>.jar，与文件列表里的既有命名保持一致
        displayName = project.findProperty('cfDisplayName') ?: "${mod_id}-${mod_version}.jar"
        releaseType = project.findProperty('cfReleaseType') ?: 'alpha'
        changelogType = 'markdown'
        changelog = project.findProperty('cfChangelog') ?: "Release ${mod_version}"
        addGameVersion minecraft_version
        addModLoader 'NeoForge'
        // CF 要求 gameVersions 里必须含 environment 组条目（错误码 1021），故显式声明双端
        addEnvironment 'Client'
        addEnvironment 'Server'
    }

    // 版本条目一律显式声明，关掉自动探测，避免从版本区间推出意外的 MC 版本
    disableVersionDetection()
}