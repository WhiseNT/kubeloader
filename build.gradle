plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'net.neoforged.moddev' version '2.0.137'
    // 注意版本：1.2.30 起要求 Gradle 运行在 JVM 25+，本工程用 JDK 21，故停在 1.1.28
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    enable {
        version = project.neoforge_version

        runs {
            configureEach {
                logLevel = org.slf4j.event.Level.DEBUG
            }

            client {
                client()
                gameDirectory = file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
                systemProperty 'mixin.env.remapRefMap', 'true'
            }

            server {
                server()
                gameDirectory = file('run')
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                systemProperty 'forge.logging.console.level', 'debug'
            }

            data {
                data()
                gameDirectory = file('run-data')
                programArguments.addAll(
                        '--mod', project.mod_id,
                        '--all',
                        '--output', file('src/generated/resources').getAbsolutePath(),
                        '--existing', file('src/main/resources').getAbsolutePath(),
                        '--existing-mod', 'kubejs'
                )
            }
        }

        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        // KubeJS 官方 maven（2101.7.2-build.374，含 ItemBehavior 重构）
        url = 'https://maven.latvian.dev/releases'
    }

    maven {
        // KubeJS 374 传递依赖 animated-gif-lib-for-java 发布于此
        url = 'https://jitpack.io'
    }

    maven {
        url = 'https://cursemaven.com/'
    }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // KubeJS 2101.7.2-build.374+（#17 修复：ItemBuilder.ReleaseUsingCallback 已重构进 ItemBehavior）
    implementation "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.374"
    implementation "curse.maven:rhino-416294:${project.rhino_curse_file}"
    // implementation "curse.maven:probejs-585406:7105159"
    implementation "curse.maven:graal-1504336:${project.graal_curse_file}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neoforge_version       : neoforge_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : '1',
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    options.compilerArgs << '-parameters'
}

// ── CurseForge 发布 ──────────────────────────────────────────────────
// 用法： CURSEFORGE_TOKEN=xxx ./gradlew publishCurseForge
// 可选： -PcfReleaseType=alpha|beta|release   -PcfDisplayName="..."   -PcfChangelog="..."
// 凭证只从环境变量读取，不写入任何版本库文件。
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = '构建并把产物上传到 CurseForge（需要环境变量 CURSEFORGE_TOKEN）'

    dependsOn tasks.named('build')
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: ''
    // 1.1.28 的默认端点是旧域名 minecraft.curseforge.com，显式改用 legacy
    apiEndpoint = project.findProperty('cfApiEndpoint') ?: 'https://legacy.curseforge.com'

    // 签名是 upload(projectId, artifact) —— 项目 ID 在前
    upload('1205072', tasks.named('jar').flatMap { it.archiveFile }) {
        displayName = project.findProperty('cfDisplayName') ?: mod_version
        releaseType = project.findProperty('cfReleaseType') ?: 'alpha'
        changelogType = 'markdown'
        changelog = project.findProperty('cfChangelog') ?: "Release ${mod_version}"
        addGameVersion minecraft_version
        addModLoader 'NeoForge'
    }

    // 版本条目一律显式声明，关掉自动探测，避免从版本区间推出意外的 MC 版本
    disableVersionDetection()
}