name: Publish to CurseForge

# 手动触发：Actions → Publish to CurseForge → Run workflow
# 需要仓库 Secret: CURSEFORGE_TOKEN（CurseForge Author/Upload API token）
# 上传由 GitHub 的 IP 发起，不受本机网络/Cloudflare 挑战影响

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - release
      display_name:
        description: 'File display name (留空则用 gradle.properties 的 mod_version)'
        required: false
        default: ''
        type: string
      java_version:
        description: 'JDK 版本（1211-Dev / 1.21.1 用 21；master / 1.20.1 用 17）'
        required: false
        default: '21'
        type: string
      changelog:
        description: 'Changelog（markdown，可多行；留空则自动生成一行）'
        required: false
        default: ''
        type: string
      dry_run:
        description: '只构建并检查元数据，不上传'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CF_PROJECT_ID: '1205072'
  CF_MOD_URL: 'https://www.curseforge.com/minecraft/mc-mods/kubeloader'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 非默认分支（如 1211-Dev）下 cache-read-only 默认为 true，缓存只读不写；
          # 显式关闭后本分支也能恢复并保存 Gradle User Home 缓存
          cache-read-only: false

      # ↓↓↓ 临时诊断步骤（查明 CF 版本表端点为何取不到数据），查完即删
      - name: Diagnose CurseForge API
        run: |
          set -uo pipefail
          echo "===== A) 版本表读取（用真 token）====="
          for base in https://legacy.curseforge.com https://www.curseforge.com https://minecraft.curseforge.com; do
            for p in /api/game/versions /api/game/version-types; do
              URL="$base$p"
              OUT="$(curl -s -w '\n__C=%{http_code}' --max-time 30 -H "X-Api-Token: ${CURSEFORGE_TOKEN}" -H "User-Agent: CurseForgeGradle/Versions/1.1.28" "$URL" || true)"
              CODE="$(printf '%s' "$OUT" | tail -1)"
              BODY="$(printf '%s' "$OUT" | sed '$d')"
              CNT="$(printf '%s' "$BODY" | grep -c '1\.21\.1' || true)"
              echo "$URL | $CODE | 1.21.1命中=$CNT | $(printf '%s' "$BODY" | head -c 90)"
            done
          done
          echo "===== B) 上传端点可达性（无效 token + 真实 multipart 体；CF 会先拒绝 token，不会产生文件）====="
          for base in https://legacy.curseforge.com https://www.curseforge.com https://minecraft.curseforge.com; do
            URL="$base/api/projects/1205072/upload-file"
            OUT="$(curl -s -w '\n__C=%{http_code}' --max-time 30 -X POST \
              -H "X-Api-Token: invalid-probe-token" -H "User-Agent: CurseForgeGradle" \
              -F 'metadata={"changelogType":"text","changelog":"probe","displayName":"probe","gameVersions":[11779],"releaseType":"alpha"};type=application/json' \
              -F "file=@/dev/null;filename=probe.jar" \
              "$URL" || true)"
            CODE="$(printf '%s' "$OUT" | tail -1)"
            BODY="$(printf '%s' "$OUT" | sed '$d' | head -c 130)"
            echo "$URL | $CODE | $BODY"
          done

      - name: Build jar
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Resolve version and jar
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          mapfile -t CANDIDATES < <(find build/libs -maxdepth 1 -name "*-${VERSION}.jar" ! -name '*sources*' -print)
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 ${VERSION} 产物，实际 ${#CANDIDATES[@]} 个: ${CANDIDATES[*]:-无}"
            ls -1 build/libs || true
            exit 1
          fi
          JAR="${CANDIDATES[0]}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          echo "版本: ${VERSION}"
          echo "产物: ${JAR} ($(du -h "${JAR}" | cut -f1))"

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeloader-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.jar }}
          if-no-files-found: error

      - name: Check CURSEFORGE_TOKEN
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true → 跳过 token 检查与上传"
            exit 0
          fi
          if [ -z "${CURSEFORGE_TOKEN}" ]; then
            echo "::error::未配置 Secret CURSEFORGE_TOKEN（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi

      - name: Publish via CurseForgeGradle
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CF_RELEASE_TYPE: ${{ inputs.release_type }}
          CF_DISPLAY_NAME: ${{ inputs.display_name }}
          CF_CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail

          if ! ./gradlew -q help --task publishCurseForge >/dev/null 2>&1; then
            echo "::error::当前分支的 build.gradle 未注册 publishCurseForge（该分支还没接入 CurseForgeGradle）"
            exit 1
          fi

          ARGS=(-PcfReleaseType="${CF_RELEASE_TYPE}")
          if [ -n "${CF_DISPLAY_NAME}" ]; then ARGS+=(-PcfDisplayName="${CF_DISPLAY_NAME}"); fi
          if [ -n "${CF_CHANGELOG}" ]; then ARGS+=(-PcfChangelog="${CF_CHANGELOG}"); fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true → 只校验发布任务图，不上传"
            ./gradlew publishCurseForge --dry-run --no-daemon "${ARGS[@]}"
            exit 0
          fi

          ./gradlew publishCurseForge --no-daemon "${ARGS[@]}"

          {
            echo "## ✅ 已提交发布到 CurseForge"
            echo ""
            echo "- 版本: \`${{ steps.meta.outputs.version }}\`"
            echo "- releaseType: \`${CF_RELEASE_TYPE}\`"
            echo "- 文件列表: ${CF_MOD_URL}/files"
            echo ""
            echo "CF 页面显示可能有延迟。"
          } >> "$GITHUB_STEP_SUMMARY"
